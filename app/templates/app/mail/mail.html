<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Contact Message</title>
    <style>
      /* Basic reset */
      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f3f5f9;
        margin: 0;
        padding: 30px 10px;
      }

      .container {
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        max-width: 600px;
        margin: 20px auto;
        overflow: hidden;
        animation: fadeIn 0.6s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        background: linear-gradient(135deg, #4f46e5, #0078d7);
        color: white;
        text-align: center;
        padding: 30px 20px;
      }

      .header h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.5px;
      }

      .content {
        padding: 30px;
      }

      .content h3 {
        color: #333;
        margin-top: 0;
        font-size: 20px;
      }

      .info-box {
        background-color: #f7f9fc;
        border-left: 5px solid #4f46e5;
        padding: 15px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .info-box p {
        margin: 8px 0;
        font-size: 15px;
        color: #444;
      }

      .message-box {
        background-color: #eef2ff;
        border: 1px solid #c7d2fe;
        padding: 20px;
        border-radius: 10px;
        color: #333;
        font-size: 15px;
        line-height: 1.6;
      }

      .footer {
        text-align: center;
        font-size: 13px;
        color: #777;
        background-color: #fafbfc;
        padding: 15px 10px;
        border-top: 1px solid #eee;
      }

      .footer a {
        color: #4f46e5;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h2>📩 New Contact Message</h2>
      </div>

      <div class="content">
        <h3>Hey Admin 👋,</h3>
        <p>You just received a new message from your website’s contact form.</p>

        <div class="info-box">
          <p><strong>👤 Name:</strong> {{ name }}</p>
          <p><strong>📧 Email:</strong> {{ email }}</p>
        </div>

        <div class="message-box">
          <p><strong>💬 Message:</strong></p>
          <p>{{ message }}</p>
        </div>

        <p style="margin-top: 25px;">
          You can reply directly to
          <a href="mailto:{{ email }}">{{ email }}</a>.
        </p>
      </div>

      <div class="footer">
        <p>© 2025 <a href="https://mr-srijan-ray.onrender.com/">Your portfolio</a>. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>

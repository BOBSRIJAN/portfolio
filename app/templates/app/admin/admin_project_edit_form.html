{% extends 'app/admin/AdminPanel.html' %}
{% load static %}


{% block content %}
<h1 class="text-4xl font-extrabold mb-12 text-gray-800 dark:text-white text-center">Edit Projects</h1>
<section class="bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-xl mb-10 max-w-3xl mx-auto">
  <form method="POST" class="space-y-6">
    {% csrf_token %}
    <input type="hidden" name="project_id" id="project_id_hidden" value="">

    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        Project Name
      </label>
      <input
        type="text"
        name="title"
        id="title"
        placeholder="Enter project name"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        About the Project
      </label>
      <textarea
        name="description"
        id="description"
        rows="4"
        placeholder="Brief description of the project..."
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      ></textarea>
    </div>

    <div>
      <label for="github_link" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
        GitHub Link
      </label>
      <input
        type="url"
        name="github_link"
        id="github_link"
        placeholder="https://github.com/your-repo"
        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      >
    </div>

    <div class="text-center">
      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-md transition duration-300 shadow-md"
      >
        Save Project
      </button>
    </div>
  </form>
</section>
{% endblock %}
